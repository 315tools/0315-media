name: 쿠팡 API 확인

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - working-directory: scripts
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python api_test.py
      - run: |
          git config user.name "0315-media bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || { git commit -m "쿠팡 API 확인 결과"; git pull --rebase; git push; }
