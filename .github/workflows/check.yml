name: 연결 확인

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 0"   # 매주 월요일 08:00 KST
  push:
    paths: [".github/workflows/check.yml", "scripts/check_accounts.py"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - working-directory: scripts
        env:
          IG_TOKEN_NEWS: ${{ secrets.IG_TOKEN_NEWS }}
          IG_USER_ID_NEWS: ${{ secrets.IG_USER_ID_NEWS }}
          IG_TOKEN_ZZAL: ${{ secrets.IG_TOKEN_ZZAL }}
          IG_USER_ID_ZZAL: ${{ secrets.IG_USER_ID_ZZAL }}
          IG_TOKEN_PICK: ${{ secrets.IG_TOKEN_PICK }}
          IG_USER_ID_PICK: ${{ secrets.IG_USER_ID_PICK }}
        run: python check_accounts.py
      - if: always()
        run: |
          git config user.name "0315-media bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || { git commit -m "계정 현황 $(date +%F)"; git pull --rebase; git push; }
