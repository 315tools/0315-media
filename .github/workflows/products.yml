name: 상품 후보 찾기

on:
  workflow_dispatch:
  push:
    paths: ["requests/**"]

permissions:
  contents: write

concurrency:
  group: products
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 바뀐 요청 날짜로 실행
        working-directory: scripts
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python products.py
      - run: |
          git config user.name "0315-media bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog assets/products
          git diff --cached --quiet || { git commit -m "상품 후보 $(date +%F_%H%M)"; git pull --rebase; git push; }
